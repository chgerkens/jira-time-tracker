name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    env:
      # One matrix entry measures coverage (c8) and enforces the thresholds
      COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        if: env.COVERAGE != 'true'
        run: npm run test:ci

      - name: Install dependencies
        if: env.COVERAGE == 'true'
        run: npm ci

      - name: Run tests with coverage
        if: env.COVERAGE == 'true'
        run: npm run coverage

      - name: Coverage summary
        if: always() && env.COVERAGE == 'true'
        run: node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && env.COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3 # v6.6.0
        with:
          report_paths: reports/junit-node.xml
          check_name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
          annotate_only: true
          detailed_summary: true
          require_tests: true

  # Installs a freshly generated test CA into each OS trust store and checks
  # that server.js trusts it without any configuration.
  trust-store:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      JTT_CERT_DIR: ${{ github.workspace }}/.test-certs
      JTT_OS_TRUSTS_TEST_CA: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate test CA
        run: node test/certs.js "${{ env.JTT_CERT_DIR }}"

      - name: Trust test CA (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo cp "$JTT_CERT_DIR/ca.pem" /usr/local/share/ca-certificates/jtt-test-ca.crt
          sudo update-ca-certificates

      - name: Trust test CA (macOS)
        if: runner.os == 'macOS'
        run: sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$JTT_CERT_DIR/ca.pem"

      - name: Trust test CA (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: certutil -addstore -f Root "$env:JTT_CERT_DIR\ca.pem"

      - name: Run TLS tests
        run: node --test --test-name-pattern="TLS verification" test/server.test.js

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3 # v6.6.0
        with:
          report_paths: reports/junit-e2e.xml
          check_name: E2E tests
          annotate_only: true
          detailed_summary: true
          require_tests: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    needs: [test, trust-store, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
