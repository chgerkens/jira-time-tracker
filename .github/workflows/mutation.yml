name: Mutation testing

# Stryker mutates server.js and public/lib.js and checks that the
# tests notice. Too slow for PRs, so it runs after relevant changes land
# on main, and on demand (Actions → Mutation testing → Run workflow).
on:
  push:
    branches: [main]
    paths:
      - server.js
      - public/lib.js
      - test/**
      - stryker.config.json
      - package.json
      - package-lock.json
  workflow_dispatch:

# A newer push makes a running mutation test obsolete
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker
        run: npm run mutation

      - name: Mutation summary
        if: always()
        run: node scripts/mutation-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
